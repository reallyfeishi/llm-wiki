# Wiki Page Schema

定义所有 wiki 页面的结构约束。

## YAML Front Matter

每个 wiki 页面必须包含以下 front matter：

```yaml
---
title: "页面标题"
created: YYYY-MM-DD          # 创建日期
updated: YYYY-MM-DD          # 最后更新日期
sources:                      # 来源列表
  - path: raw/filename.md     # 源文件路径（相对于 knowledge-base/）
    lines: "L1-L100"          # 行号范围，支持 "L1,L5,L23-L40"
    ingested: YYYY-MM-DD      # 摄入日期
tags: [tag1, tag2]           # 标签
category: concept|entity|decision|source-summary  # 分类
links_to: [page-slug-1]      # 引用的 wiki 页面
linked_from: [page-slug-2]   # 引用本页面的页面（自动维护）
status: active|stale|orphan|draft|needs-verification  # 状态
---
```

## 正文格式

```markdown
# 页面标题

> 简短摘要（1-2 句概括页面内容）

## 小节标题

具体内容，每个关键事实后附加引用：

事实描述。^[source-filename:L-start-L-end]

另一个事实。^[source-filename:L-line]

## 相关页面

- [[related-page-1]]
- [[related-page-2]]

## 来源

- raw/source-filename.md, L1-L100
```

## 约束

- `max_index_entries`: 50（index.md 最多 50 个直接条目）
- `orphan_threshold_days`: 30（超过 30 天无链接标记孤立）
- `verification_sample_size`: 5（月度深检抽样数）
- 每个关键事实必须有来源标注
- 数字/百分比/结论不得重述，必须直接引用
- 新建页面至少 2 个双向链接
